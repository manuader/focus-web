<head>
<meta charset="utf-8">
<title>FOCUS · anuncio</title>
<!-- Tipografía, paleta y grano: los mismos tokens de la tanda orgánica. -->
<link rel="stylesheet" href="/instagram/produccion/engine/brand.css">
<link rel="stylesheet" href="ads.css">
<script type="importmap">
{ "imports": {
  "three": "/instagram/campana-ads-01/produccion/node_modules/three/build/three.module.js",
  "three/addons/": "/instagram/campana-ads-01/produccion/node_modules/three/examples/jsm/"
} }

<!-- Motor base (texto, imagen, anillos, retícula, haz, logo, grupos) y la
     extensión de la campaña (GLSL, escenas 3D, interfaz, rótulos, cierre). -->
<script src="/instagram/produccion/engine/engine.js"></script>
<script src="glsl.js"></script>
<script src="engine2.js"></script>
</head>
<body>
<div id="stage"></div>
<script>
  // ?id=a01 → carga ../ads/a01.js, que llama a F.mount(spec).
  // ?id=a01b → el mismo archivo con F.variant = 'b' (variante para prueba A/B).
  const id = new URLSearchParams(location.search).get('id');
  const m = id.match(/^(a\d\d)([b-z])$/);
  F.variant = m ? m[2] : null;
  const s = document.createElement('script');
  s.src = '../ads/' + (m ? m[1] : id) + '.js';
  document.body.appendChild(s);
</script>
</body>
</html>
