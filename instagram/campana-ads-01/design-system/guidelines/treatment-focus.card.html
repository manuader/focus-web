<!-- @dsCard group="Brand" viewport="700x360" name="Tratamiento — foco único + blur + grano" subtitle="Un solo punto nítido, siempre descentrado; resto en blur/grano/viraje frío" -->
<link rel="stylesheet" href="../styles.css">
<div style="height:360px;background:#000;position:relative;overflow:hidden;">
  <img src="../assets/imagery/reference-poster-01.jpg" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.05) brightness(.7);">
  <svg style="position:absolute;inset:0;width:100%;height:100%;opacity:.35;pointer-events:none;">
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="100%" height="100%" filter="url(#grain)"/>
  </svg>
  <div style="position:absolute;left:32px;bottom:28px;font:600 13px var(--font-body);letter-spacing:.18em;color:#fff;text-transform:uppercase;">Punto nítido descentrado</div>
</div>
