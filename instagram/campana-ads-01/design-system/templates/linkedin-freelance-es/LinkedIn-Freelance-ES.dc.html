<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="FOCUS — Posteo LinkedIn (ES)" description="Pieza única cuadrada 1200x1200 para LinkedIn, versión español" -->
<helmet>
  <script src="./ds-base.js"></script>
  <style>body{margin:0;background:#111214;display:flex;align-items:center;justify-content:center;min-height:100vh;}</style>
</helmet>

<div data-screen-label="LinkedIn ES" style="width:1200px;height:1200px;position:relative;overflow:hidden;background:var(--focus-paper,#F6F6F4);flex:none;">

  <div style="position:absolute;left:-180px;top:180px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(167,172,180,.34) 0%,rgba(167,172,180,0) 68%);filter:blur(46px);"></div>

  <svg viewBox="0 0 800 800" style="position:absolute;right:-260px;bottom:-260px;width:820px;height:820px;color:#A7ACB4;opacity:.5;filter:blur(3.5px);">
    <g fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="400" cy="400" r="120"/><circle cx="400" cy="400" r="190"/><circle cx="400" cy="400" r="265"/><circle cx="400" cy="400" r="345"/><circle cx="400" cy="400" r="430"/></g>
  </svg>
  <svg viewBox="0 0 800 800" style="position:absolute;right:-260px;bottom:-260px;width:820px;height:820px;color:var(--focus-magenta,#FF00FF);opacity:.9;">
    <circle cx="400" cy="400" r="48" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="400" cy="400" r="7" fill="currentColor"/>
  </svg>

  <svg style="position:absolute;inset:0;width:100%;height:100%;opacity:.19;mix-blend-mode:multiply;pointer-events:none;">
    <filter id="grainEs"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="100%" height="100%" filter="url(#grainEs)"/>
  </svg>

  <img src="../../assets/logo/focus-logo-dark.png" alt="FOCUS" style="position:absolute;top:88px;left:88px;width:168px;z-index:5;">

  <div style="position:absolute;left:88px;top:392px;width:970px;z-index:4;">
    <div style="font:700 92px/1.03 'Source Serif 4',Georgia,serif;color:var(--focus-ink,#0A0A0B);letter-spacing:-0.01em;text-wrap:pretty;">En Focus no decimos <span style="color:var(--focus-magenta,#FF00FF);">&lsquo;freelance&rsquo;</span>.</div>
    <div style="margin-top:44px;width:44px;height:2px;background:var(--focus-ink,#0A0A0B);"></div>
    <div style="margin-top:44px;font:400 30px/1.45 'Rotis Semi Sans','Rotis Sans Serif',Helvetica,Arial,sans-serif;color:var(--focus-gray-500,#6B7078);max-width:760px;text-wrap:pretty;">Un criterio, aplicado a las siete disciplinas del estudio.</div>
  </div>

  <div style="position:absolute;left:88px;bottom:88px;font:600 15px/1.2 'Rotis Semi Sans',Helvetica,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--focus-gray-500,#6B7078);z-index:4;">El punto donde todo cambia</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:1200}}"></script>
</body>
</html>
