<!-- @dsCard group="Colors" viewport="700x160" name="Chromatic aberration triplet" subtitle="Repeat one element offset in this exact color order" -->
<link rel="stylesheet" href="../styles.css">
<div style="height:160px;background:var(--focus-ink);display:flex;align-items:center;justify-content:center;">
  <div style="position:relative;width:120px;height:80px;">
    <div style="position:absolute;inset:0;transform:translate(-6px,-3px);background:var(--focus-magenta);mix-blend-mode:screen;"></div>
    <div style="position:absolute;inset:0;transform:translate(0,0);background:var(--focus-blue);mix-blend-mode:screen;"></div>
    <div style="position:absolute;inset:0;transform:translate(6px,3px);background:var(--focus-green);mix-blend-mode:screen;"></div>
  </div>
</div>
